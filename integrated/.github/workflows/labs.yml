# Runs every L600 integrated project on Linux, macOS (Apple silicon, arm64) and Windows (x64):
# the scorecard (must pass), the seeded failure lab (must FAIL - proves the seam test bites), the unit tests and the
# question-bank checks. Projects import the other topics' labs, so the whole repository is checked out.
# Locally (Linux sandbox) all of this ran; macOS/Windows run here for the first time (pending-ci).
name: labs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-projects:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        lab: [01-pq-replicated-messaging, 02-quantum-safe-migration, 03-agent-driven-simulation, 04-microbit-sensor-fleet, 05-observatory-scheduler, 06-signed-science-data, 07-quantum-job-service, 08-secure-agent-tools]
        include:
          - { lab: 01-pq-replicated-messaging, inject: "leader-counter", nn: "01" }
          - { lab: 02-quantum-safe-migration, inject: "bypass", nn: "02" }
          - { lab: 03-agent-driven-simulation, inject: "few-reps", nn: "03" }
          - { lab: 04-microbit-sensor-fleet, inject: "wallclock-lww", nn: "04" }
          - { lab: 05-observatory-scheduler, inject: "local-as-utc", nn: "05" }
          - { lab: 06-signed-science-data, inject: "float-format", nn: "06" }
          - { lab: 07-quantum-job-service, inject: "lease-expiry", nn: "07" }
          - { lab: 08-secure-agent-tools, inject: "naive-host", nn: "08" }
    defaults:
      run:
        shell: bash  # Git Bash on Windows: the same commands run on all three runners
        working-directory: labs/L600/${{ matrix.lab }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.15"
      - name: Install pinned dependencies (wheels only)
        run: "python -m pip install --only-binary=:all: numpy==2.5.3 cryptography==50.0.2"
      - name: Scorecard (all milestones, seams and fitness functions must pass)
        run: python run_project.py
      - name: Failure lab (the seeded integration fault must make the scorecard fail)
        run: |
          if python run_project.py --inject ${{ matrix.inject }}; then
            echo "::error::--inject ${{ matrix.inject }} did not fail the scorecard"; exit 1
          fi
      - name: Unit, seam and failure-lab tests
        run: python -m unittest discover -s tests -v
      - name: Question bank and number checks
        run: python ../../../research/checks_${{ matrix.nn }}.py

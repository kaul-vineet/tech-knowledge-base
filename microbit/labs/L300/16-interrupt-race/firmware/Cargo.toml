# Lab 16 firmware: nRF52833 (micro:bit V2), Rust + Embassy. pending-ci: not built here.
# Versions as listed on crates.io / the embassy examples (checked 2026-10-28).
[package]
name = "microbit-v2-interrupt-race"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1" }
embassy-nrf = { version = "0.11.0", features = ["nrf52833", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-halt = "1.0.0"

[profile.release]
debug = 2          # symbols in the ELF: Renode and GDB can show function names
opt-level = "s"
